services:
  db:
    image: postgres:16-alpine
    container_name: jernery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jernery_user
      POSTGRES_PASSWORD: jernery_password
      POSTGRES_DB: jernery_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U jernery_user -d jernery_db"]
      interval: 10s
      timeout: 5s 
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true  
    tmpfs:
      - /tmp
      -  /run
    volumes:
    - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jernery-backend
    environment:
       PORT: "5000"
       DB_USER: jernery_user
       DB_PASSWORD: jernery_password
       DB_NAME: jernery_db
       DB_HOST: db  
       DB_PORT: "5432"
    expose: 
      - "5000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      db:
        condition:  service_healthy
    tmpfs:
      - /tmp
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jernery-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
volumes:
  pgdata:
    driver: local
    
      
     
