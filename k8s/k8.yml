apiVersion: v1
kind: Namespace
metadata:
  name: jernery
  labels:
    app.kubernetes.io/part-of: jernery
---
#- EBS-Storage
apiVersion: v1
kind: Secret
metadata:
  name: jernery-secret
  namespace: jernery
  labels:
    app.kubernetes.io/part-of: jernery
type: Opaque
data:
  POSTGRES_USER: amVybmVyeV91c2VyCg==
  POSTGRES_PASSWORD: amVybmVyeV9wYXNzd29yZAo=
  POSTGRES_DB: amVybmVyeV9kYgo=
---
#-Storageclass
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jernery-ebs-sc
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
#- database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc
  namespace: jernery
  labels:
    app.kubernetes.io/part-of: jernery
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: jernery-ebs-sc
  resources:
    requests:
      storage: 10Gi
---
#-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: jernery
  labels:
    app.kubernetes.io/name: jernery-db
    app.kubernetes.io/part-of: jernery
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jernery-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jernery-db
        app.kubernetes.io/part-of: jernery
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: postgres:16-alpine 
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: jernery-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          livenessProbe:
            exec:
              command: [ "pg_isready", "-U", "jernery_user", "-d", "jernery_db" ]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [ "pg_isready", "-U", "jernery_user", "-d", "jernery_db" ]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: pvc
---
#-db-service
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: jernery
  labels:
    app.kubernetes.io/name: jernery-db
    app.kubernetes.io/part-of: jernery
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jernery-db
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
---
#-backend-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: jernery
  labels:
    app.kubernetes.io/name: jernery-backend
    app.kubernetes.io/part-of: jernery
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jernery-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jernery-backend
        app.kubernetes.io/part-of: jernery
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - c
            - |
              echo "waiting for db-service:5432..."
              until nc -z db-service 5432; do
                echo "DB not ready, retrying in 3s ...."
                sleep 3
              done
              echo "DB is ready"
      containers:
        - name: backend
          image: BACKEND_IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "db-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jernery-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
              httpGet:
                path: /api/health
                port: 5000
              initialDelaySeconds: 10
              periodSeconds: 15
              timeoutSeconds: 5
          readinessProbe:
              httpGet:
                path: /api/health
                port: 5000
              initialDelaySeconds:  5
              periodSeconds: 5
              timeoutSeconds: 3
---
#backend-service
apiVersion: v1
kind: Service
metadata:
  name: jernery-backend
  namespace: jernery
  labels:
    app.kubernetes.io/name: jernery-backend
    app.kubernetes.io/part-of: jernery
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jernery-backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
---
# frontend-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jernery-frontend
  namespace: jernery
  labels:
    app.kubernetes.io/name: jernery-frontend
    app.kubernetes.io/part-of: jernery
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jernery-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jernery-frontend
        app.kubernetes.io/part-of: jernery
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: FRONTEND_IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Nginx needs write for cache/pid
            runAsNonRoot: true
            runAsUser: 101 # nginx user UID in alpine
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
#-froentend-service
apiVersion: v1
kind: Service
metadata:
  name: jernery-frontend
  namespace: jernery
  labels:
    app.kubernetes.io/name: jernery-frontend
    app.kubernetes.io/part-of: jernery
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jernery-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---
#networkpolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jernery-db-allow-backend-only
  namespace: jernery
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jernery-db
  policyTypes:
    - Ingress
  ingress:
    - from: 
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jernery-backend
      ports:
        - port: 5432
          protocol: TCP
---
#-networkpolicy

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jernery-frontend
  namespace: jernery
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jernery-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jernery-frontend
      ports:
      - port: 5000           # ← ADD THIS DASH
        protocol: TCP
